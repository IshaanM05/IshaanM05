<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 214"
     width="490" height="214">
  <style>
    text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 14px;
    }
    .key { fill: #39d353; font-weight: bold; }
    .val { fill: #c9d1d9; }
    .title { fill: #8b949e; font-size: 13px; }
  </style>
  <rect x="0.5" y="0.5" width="489" height="213" rx="8"
    fill="#0d1117" stroke="#30363d" />
  <rect x="0.5" y="0.5" width="489" height="36" rx="8" fill="#161b22" />
  <rect x="0.5" y="28.5" width="489" height="8" fill="#161b22" />
  <circle cx="18" cy="20" r="5" fill="#ff5f56"/><circle cx="34" cy="20" r="5" fill="#ffbd2e"/><circle cx="50" cy="20" r="5" fill="#27c93f"/>
  <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.05s" dur="0.3s" fill="freeze" />
    <text x="245.0" y="24" text-anchor="middle" class="title">ishaan@github</text>
  </g>

    <g opacity="0" transform="translate(-16,0)">
        <animate attributeName="opacity" from="0" to="1"
          begin="0.40s" dur="0.50s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate"
          from="-16,0" to="0,0"
          begin="0.40s" dur="0.50s" fill="freeze"
          calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      <text x="24" y="70" class="key">Now</text>
      <text x="132" y="70" class="val">Perception Lead, IITB Racing</text>
    </g>
    <g opacity="0" transform="translate(-16,0)">
        <animate attributeName="opacity" from="0" to="1"
          begin="0.52s" dur="0.50s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate"
          from="-16,0" to="0,0"
          begin="0.52s" dur="0.50s" fill="freeze"
          calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      <text x="24" y="100" class="key">Prev</text>
      <text x="132" y="100" class="val">Lead Intern, MapIoT AI</text>
    </g>
    <g opacity="0" transform="translate(-16,0)">
        <animate attributeName="opacity" from="0" to="1"
          begin="0.64s" dur="0.50s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate"
          from="-16,0" to="0,0"
          begin="0.64s" dur="0.50s" fill="freeze"
          calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      <text x="24" y="130" class="key">Stack</text>
      <text x="132" y="130" class="val">C++ · Python · ROS 2 · PyTorch</text>
    </g>
    <g opacity="0" transform="translate(-16,0)">
        <animate attributeName="opacity" from="0" to="1"
          begin="0.76s" dur="0.50s" fill="freeze" />
        <animateTransform attributeName="transform" type="translate"
          from="-16,0" to="0,0"
          begin="0.76s" dur="0.50s" fill="freeze"
          calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      <text x="24" y="160" class="key">Highlights</text>
      <text x="132" y="160" class="val">FSP Champion '26 · FSAI 4th '25</text>
    </g>
</svg>
